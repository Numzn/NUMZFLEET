name: Production deploy

# push to main (or a manual dispatch) -> tests -> SHA-tagged images on Docker Hub -> NUMZ-PRODUCTION (RocketVPS)
# deploys them through the forced-command wrapper `numzfleet-deploy`, which is installed on the server from a
# reviewed commit. This is the only deploy path. CI holds a restricted key that can ONLY run
# `deploy <sha>` / `check <sha>`, and sends a DATA-ONLY payload (migrations + compose file): no script that
# runs on the server comes from CI.

on:
  push:
    branches: [main]
    paths:
      - "traccar-fleet-system/frontend/**"
      - "fuel-api/**"
      - "erb-fuel-monitor/**"
      - "deployment/**"
      - ".github/workflows/main.yml"
  workflow_dispatch:
    inputs:
      git_sha:
        description: "Full 40-hex SHA to deploy (break-glass). Defaults to the current ref."
        required: false
        type: string
      dry_run:
        description: "Run the read-only `check` on the server instead of deploying."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    # fuel-api's test suite includes real-DB integration tests (not pure unit
    # tests) — see e.g. src/vehicleEngine/vehicleEngineService.test.js,
    # src/immobilization/executionClaim.test.js. This service container is
    # what makes `npm test` connectable; without it every DB-touching test
    # fails with SequelizeConnectionRefusedError.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: fuel_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Resolve target SHA
        id: target
        env:
          SHA_INPUT: ${{ github.event.inputs.git_sha }}
        run: |
          set -euo pipefail
          SHA="${SHA_INPUT:-$GITHUB_SHA}"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "target SHA must be 40 lowercase hex characters" >&2; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: fuel-api/package-lock.json

      - name: Install and test fuel-api
        working-directory: fuel-api
        env:
          # Real Postgres service above — a meaningful slice of this suite runs
          # actual DB queries, not just pure unit tests.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/fuel_ci
        run: |
          npm ci
          # Build the test schema the same way the app bootstraps it at runtime
          # (models/index.js's syncDatabase, called from server.js on startup) —
          # deliberately not the raw SQL migration replay in
          # deployment/utils/run-fuel-migrations.sh. That script targets an
          # already-long-lived database (production has never been "fresh");
          # replaying it against a truly empty DB surfaces old, unrelated
          # idempotency quirks (case-folded constraint names, etc.) that have
          # never mattered in the real deploy sequence and aren't this job's
          # concern. Real production migrations still run for real at deploy
          # time on the server (numzfleet-deploy), against the actual long-lived prod DB.
          node -e "import('./src/models/index.js').then(m => m.syncDatabase()).then(() => process.exit(0)).catch((e) => { console.error(e); process.exit(1); })"
          npm test

      - name: Validate MIGRATION_ORDER matches migration files
        run: |
          set -euo pipefail
          # shellcheck source=deployment/utils/fuel-migrations-lib.sh
          source deployment/utils/fuel-migrations-lib.sh
          load_migration_files_from_order
          echo "OK: ${#MIGRATION_FILES[@]} migrations in MIGRATION_ORDER"

      - name: Setup Node.js (frontend)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: traccar-fleet-system/frontend/package-lock.json

      - name: Install, lint, test and build frontend
        working-directory: traccar-fleet-system/frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

  build-and-push:
    needs: quality-checks
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ needs.quality-checks.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.quality-checks.outputs.sha }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Image tags are immutable: a SHA that is already published is never rebuilt or overwritten. Re-running or
      # re-dispatching a SHA that is already live therefore deploys exactly the images that are running.
      - name: Check whether this SHA is already published
        id: published
        env:
          SHA: ${{ needs.quality-checks.outputs.sha }}
          NS: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          all=true
          for img in numzfleet-frontend numzfleet-backend numzfleet-erb; do
            if docker manifest inspect "$NS/$img:$SHA" >/dev/null 2>&1; then
              echo "already published: $img:${SHA:0:12}"
            else
              echo "not published yet: $img:${SHA:0:12}"
              all=false
            fi
          done
          echo "all=$all" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.published.outputs.all != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend
        if: steps.published.outputs.all != 'true'
        uses: docker/build-push-action@v6
        with:
          context: traccar-fleet-system/frontend
          file: traccar-fleet-system/frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/numzfleet-frontend:${{ needs.quality-checks.outputs.sha }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || 'https://numz.site' }}
            VITE_TRACCAR_PREFIX=/traccar
            VITE_FLEET_COMMAND_SHEET=1
            BUILD_REF=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push backend
        if: steps.published.outputs.all != 'true'
        uses: docker/build-push-action@v6
        with:
          context: fuel-api
          file: fuel-api/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/numzfleet-backend:${{ needs.quality-checks.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push ERB
        if: steps.published.outputs.all != 'true'
        uses: docker/build-push-action@v6
        with:
          context: erb-fuel-monitor
          file: erb-fuel-monitor/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/numzfleet-erb:${{ needs.quality-checks.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      TARGET_SHA: ${{ needs.build-and-push.outputs.sha }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-and-push.outputs.sha }}

      - name: Verify image manifests exist
        run: |
          chmod +x deployment/verify/verify-docker-manifests.sh
          deployment/verify/verify-docker-manifests.sh "$TARGET_SHA" "${{ secrets.DOCKERHUB_USERNAME }}"

      - name: Set up SSH (restricted deploy key, pinned host key)
        env:
          DEPLOY_KEY: ${{ secrets.ROCKETVPS_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.ROCKETVPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts_vps
          chmod 644 ~/.ssh/known_hosts_vps

      - name: Deploy on NUMZ-PRODUCTION (or read-only check when dry_run)
        env:
          SSH_HOST: ${{ vars.ROCKETVPS_SSH_HOST }}
          SSH_USER: ${{ vars.ROCKETVPS_SSH_USER }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "refusing: target SHA is not 40 lowercase hex" >&2; exit 1; }
          VERB=deploy
          if [[ "$DRY_RUN" == "true" ]]; then VERB=check; fi
          echo "target ${TARGET_SHA} verb ${VERB}"
          # Data-only payload: migrations + compose file. The server validates it against an allow-list.
          git archive --format=tar "$TARGET_SHA" fuel-api/migrations deployment/compose/docker-compose.prod.yml \
            | ssh -i ~/.ssh/id_deploy \
                -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
                -o UserKnownHostsFile="$HOME/.ssh/known_hosts_vps" \
                -o ConnectTimeout=20 -o ServerAliveInterval=30 \
                "$SSH_USER@$SSH_HOST" "$VERB $TARGET_SHA"

      - name: Verify production health
        if: env.DRY_RUN != 'true'
        run: |
          curl -fsS --max-time 30 "https://numz.site/health"
          curl -fsS --max-time 30 "https://numz.site/api/health"
